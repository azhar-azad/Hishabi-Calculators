info:
  name: User Signup
  type: http
  seq: 4

http:
  method: POST
  url: {{base_url}}/api/auth/signup
  body:
    type: json
    data: |-
      {
        "email": "{{test_email}}",
        "password": "{{test_password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
